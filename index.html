<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Museum of Our Memories</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #070605;
      color: #f3e8d8;
      font-family: "Inter", "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 40%, rgba(201, 162, 39, 0.16), transparent 55%),
        rgba(7, 6, 5, 0.94);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .kicker {
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #c9a227;
      margin-bottom: 20px;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2.8rem, 9vw, 6.5rem);
      font-weight: 600;
      line-height: 1;
    }

    .subtitle {
      max-width: 540px;
      margin-top: 22px;
      color: #a99f90;
      font-weight: 300;
      line-height: 1.7;
    }

    .start {
      margin-top: 40px;
      padding: 16px 38px;
      border: 1px solid rgba(201, 162, 39, 0.6);
      background: transparent;
      color: #f3e8d8;
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .start:hover {
      background: #c9a227;
      color: #14100a;
    }

    .controls {
      margin-top: 28px;
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      color: rgba(243, 232, 216, 0.45);
      text-transform: uppercase;
    }

    #memoryCard {
      position: fixed;
      left: 50%;
      bottom: 42px;
      transform: translateX(-50%);
      z-index: 15;
      max-width: min(620px, 90vw);
      padding: 20px 26px;
      border: 1px solid rgba(201, 162, 39, 0.35);
      background: rgba(10, 8, 6, 0.78);
      backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #memoryCard.visible {
      opacity: 1;
      visibility: visible;
    }

    #memoryDate {
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #c9a227;
    }

    #memoryTitle {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.7rem;
      margin-top: 8px;
    }

    #memoryText {
      margin-top: 10px;
      color: #a99f90;
      font-size: 0.92rem;
      line-height: 1.6;
      font-weight: 300;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      margin: -2.5px 0 0 -2.5px;
      border-radius: 50%;
      background: rgba(243, 232, 216, 0.7);
      z-index: 10;
      pointer-events: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      background: #070605;
      color: #c9a227;
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <div id="loading">Preparing the museum…</div>

  <div id="overlay">
    <p class="kicker">A private exhibition</p>
    <h1>Museum of<br>Our Memories</h1>
    <p class="subtitle">
      Walk slowly through the gallery.
      When you stand before a memory, it will begin to play.
    </p>
    <button class="start" id="startButton">Enter the museum</button>
    <p class="controls">W A S D — Walk &nbsp;•&nbsp; Mouse — Look &nbsp;•&nbsp; Esc — Pause</p>
  </div>

  <div id="crosshair"></div>

  <div id="memoryCard">
    <p id="memoryDate"></p>
    <h2 id="memoryTitle"></h2>
    <p id="memoryText"></p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

    const overlay = document.getElementById("overlay");
    const startButton = document.getElementById("startButton");
    const loading = document.getElementById("loading");
    const memoryCard = document.getElementById("memoryCard");
    const memoryDate = document.getElementById("memoryDate");
    const memoryTitle = document.getElementById("memoryTitle");
    const memoryText = document.getElementById("memoryText");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080605);
    scene.fog = new THREE.Fog(0x080605, 8, 34);

    const camera = new THREE.PerspectiveCamera(
      72,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 1.65, 9);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new PointerLockControls(camera, renderer.domElement);
    scene.add(controls.getObject());

    /* ---------- Lighting ---------- */

    scene.add(new THREE.AmbientLight(0xffe9c4, 0.22));

    const warmLight = new THREE.PointLight(0xffc978, 22, 22, 2);
    warmLight.position.set(0, 4.2, 4);
    scene.add(warmLight);

    const galleryLight = new THREE.PointLight(0xffd9a0, 16, 30, 2);
    galleryLight.position.set(0, 4.5, -4);
    scene.add(galleryLight);

    const blueAccent = new THREE.PointLight(0x6d8cff, 7, 22, 2);
    blueAccent.position.set(-6, 3, -1);
    scene.add(blueAccent);

    const pinkAccent = new THREE.PointLight(0xff8ba7, 7, 22, 2);
    pinkAccent.position.set(6, 3, -1);
    scene.add(pinkAccent);

    /* ---------- Museum room ---------- */

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x171310,
      roughness: 0.85,
      metalness: 0.05
    });

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 34),
      floorMaterial
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0x1d1712,
      roughness: 0.95
    });

    const backWall = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 9),
      wallMaterial
    );
    backWall.position.set(0, 4.5, -8);
    scene.add(backWall);

    const leftWall = new THREE.Mesh(
      new THREE.PlaneGeometry(34, 9),
      wallMaterial
    );
    leftWall.position.set(-15, 4.5, 0);
    leftWall.rotation.y = Math.PI / 2;
    scene.add(leftWall);

    const rightWall = new THREE.Mesh(
      new THREE.PlaneGeometry(34, 9),
      wallMaterial
    );
    rightWall.position.set(15, 4.5, 0);
    rightWall.rotation.y = -Math.PI / 2;
    scene.add(rightWall);

    const ceiling = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 34),
      new THREE.MeshStandardMaterial({ color: 0x0d0a08 })
    );
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = 9;
    scene.add(ceiling);

    // Subtle floor guide line
    const guide = new THREE.Mesh(
      new THREE.PlaneGeometry(0.08, 30),
      new THREE.MeshBasicMaterial({
        color: 0xc9a227,
        transparent: true,
        opacity: 0.18
      })
    );
    guide.rotation.x = -Math.PI / 2;
    guide.position.set(0, 0.01, 0);
    scene.add(guide);

    /* ---------- Memory data ---------- */

    const memories = [
      {
        video: "videos/memory1.mp4",
        position: new THREE.Vector3(-7, 3.1, -7.85),
        date: "Room 01 — The Beginning",
        title: "The Day Everything Started",
        text: "Write the story of this memory here. Where were you, what happened, and why does it still matter?"
      },
      {
        video: "videos/memory2.mp4",
        position: new THREE.Vector3(0, 3.1, -7.85),
        date: "Room 02 — A Small Adventure",
        title: "The Trip We Still Talk About",
        text: "Add the place, the weather, the food, the joke, or the tiny detail you never want to forget."
      },
      {
        video: "videos/memory3.mp4",
        position: new THREE.Vector3(7, 3.1, -7.85),
        date: "Room 03 — Ordinary Magic",
        title: "An Ordinary Day That Felt Special",
        text: "Sometimes the best memories are quiet ones—the moments that became meaningful only later."
      }
    ];

    const videoMeshes = [];
    const activeMemories = [];

    function createMemoryExhibit(memory, index) {
      const group = new THREE.Group();
      group.position.copy(memory.position);

      // Golden frame
      const frame = new THREE.Mesh(
        new THREE.BoxGeometry(5.4, 3.25, 0.16),
        new THREE.MeshStandardMaterial({
          color: 0x2b231a,
          roughness: 0.55,
          metalness: 0.25
        })
      );
      group.add(frame);

      const goldEdge = new THREE.Mesh(
        new THREE.BoxGeometry(5.55, 3.4, 0.08),
        new THREE.MeshStandardMaterial({
          color: 0xc9a227,
          roughness: 0.35,
          metalness: 0.85
        })
      );
      goldEdge.position.z = -0.06;
      group.add(goldEdge);

      // Video screen
      const video = document.createElement("video");
      video.src = memory.video;
      video.loop = true;
      video.muted = true;
      video.playsInline = true;
      video.preload = "auto";
      video.crossOrigin = "anonymous";

      const videoTexture = new THREE.VideoTexture(video);
      videoTexture.colorSpace = THREE.SRGBColorSpace;
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;

      const screen = new THREE.Mesh(
        new THREE.PlaneGeometry(5, 2.82),
        new THREE.MeshBasicMaterial({
          map: videoTexture,
          toneMapped: false
        })
      );
      screen.position.z = 0.09;
      group.add(screen);

      // Museum label
      const labelCanvas = document.createElement("canvas");
      labelCanvas.width = 1024;
      labelCanvas.height = 256;

      const ctx = labelCanvas.getContext("2d");
      ctx.fillStyle = "#161310";
      ctx.fillRect(0, 0, labelCanvas.width, labelCanvas.height);

      ctx.fillStyle = "#c9a227";
      ctx.font = "600 34px Inter, Arial";
      ctx.fillText(memory.date.toUpperCase(), 45, 75);

      ctx.fillStyle = "#f3e8d8";
      ctx.font = "600 54px Georgia, serif";
      ctx.fillText(memory.title, 45, 150);

      ctx.fillStyle = "#a99f90";
      ctx.font = "300 30px Inter, Arial";
      ctx.fillText("Stand close to play this memory", 45, 210);

      const labelTexture = new THREE.CanvasTexture(labelCanvas);
      labelTexture.colorSpace = THREE.SRGBColorSpace;

      const label = new THREE.Mesh(
        new THREE.PlaneGeometry(3.4, 0.85),
        new THREE.MeshBasicMaterial({ map: labelTexture })
      );
      label.position.set(0, 0.95, 0.1);
      group.add(label);

      // Soft spotlight above the frame
      const spotlight = new THREE.PointLight(0xffd9a0, 9, 8, 2);
      spotlight.position.set(0, 2.4, 1.6);
      group.add(spotlight);

      scene.add(group);

      videoMeshes.push({
        group,
        screen,
        video,
        memory,
        index
      });

      activeMemories.push(false);
    }

    memories.forEach(createMemoryExhibit);

    /* ---------- Walking ---------- */

    const keys = {};
    const walkSpeed = 3.2;
    const clock = new THREE.Clock();

    document.addEventListener("keydown", event => {
      keys[event.code] = true;
    });

    document.addEventListener("keyup", event => {
      keys[event.code] = false;
    });

    function updateMovement() {
      const delta = clock.getDelta();

      if (!controls.isLocked) return;

      if (keys["KeyW"] || keys["ArrowUp"]) controls.moveForward(walkSpeed * delta);
      if (keys["KeyS"] || keys["ArrowDown"]) controls.moveForward(-walkSpeed * delta);
      if (keys["KeyA"] || keys["ArrowLeft"]) controls.moveRight(-walkSpeed * delta);
      if (keys["KeyD"] || keys["ArrowRight"]) controls.moveRight(walkSpeed * delta);

      // Keep visitor inside the gallery
      controls.getObject().position.x = THREE.MathUtils.clamp(
        controls.getObject().position.x,
        -13.5,
        13.5
      );

      controls.getObject().position.z = THREE.MathUtils.clamp(
        controls.getObject().position.z,
        -6.5,
        13
      );

      controls.getObject().position.y = 1.65;
    }

    /* ---------- Memory interaction ---------- */

    function updateMemories() {
      const playerPosition = controls.getObject().position;
      let nearestIndex = -1;
      let nearestDistance = Infinity;

      videoMeshes.forEach((item, index) => {
        const distance = playerPosition.distanceTo(item.group.position);

        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestIndex = index;
        }

        const shouldPlay = distance < 5.2;

        if (shouldPlay && video.paused) {
          video.play().catch(() => {});
          activeMemories[index] = true;
        } else if (!shouldPlay && !video.paused) {
          video.pause();
          activeMemories[index] = false;
        }

        // Make nearby screens gently glow
        const glow = THREE.MathUtils.clamp(1 - distance / 12, 0, 1);
        item.screen.material.color.setScalar(0.65 + glow * 0.35);
      });

      const nearest = videoMeshes[nearestIndex];

      if (nearest && nearestDistance < 6.5) {
        memoryDate.textContent = nearest.memory.date;
        memoryTitle.textContent = nearest.memory.title;
        memoryText.textContent = nearest.memory.text;
        memoryCard.classList.add("visible");
      } else {
        memoryCard.classList.remove("visible");
      }
    }

    /* ---------- Start and resize ---------- */

    startButton.addEventListener("click", () => {
      loading.style.display = "grid";

      // Give videos a moment to begin loading
      setTimeout(() => {
        loading.style.display = "none";
        overlay.classList.add("hidden");
        controls.lock();
      }, 700);
    });

    controls.addEventListener("unlock", () => {
      overlay.classList.remove("hidden");
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ---------- Animation loop ---------- */

    function animate() {
      requestAnimationFrame(animate);

      updateMovement();
      updateMemories();

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
